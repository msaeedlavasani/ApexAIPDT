name: DPT Current Validation

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure and hygiene
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/TASKS.md
          test -f .dpt/status.json
          test -f docs/DPT_OPEN_DECISIONS.md
          test -f docs/DPT_ARCHITECTURE_DECISIONS.md
          test -f .gitignore
          test -z "$(git status --porcelain)"
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" || git diff --check

  canonical-governance:
    name: Canonical Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate durable governance without mutation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('.dpt/status.json').read_text())
          assert isinstance(status.get('state_revision'), int)
          assert isinstance(status.get('summary'), dict)
          assert Path('docs/TASKS.md').read_text().count('[DELTA]') > 0
          json.loads(Path('.dpt/capability-inventory.json').read_text())
          json.loads(Path('.dpt/pause-readiness-certification.json').read_text())
          print('canonical state is syntactically valid and CI will not rewrite it')
          PY

  schemas:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schemas and registries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path('docs/schemas').glob('*.json'): json.loads(p.read_text())
          for p in [Path('docs/component-registry.json'),Path('docs/asset-registry.json')]:
            if p.exists(): json.loads(p.read_text())
          PY

  deterministic-runtime:
    name: Deterministic Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax and deterministic runtime proof
        run: |
          set -euo pipefail
          for f in providers/goose/*.mjs; do node --check "$f"; done
          node --test providers/goose/test-adapter-conformance.mjs providers/goose/test-capability-reconciliation.mjs providers/goose/test-autonomous-handoff.mjs providers/goose/test-autonomous-admission-loop.mjs

  provider-contracts:
    name: Provider Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Validate provider-neutral contracts
        run: |
          set -euo pipefail
          node --test providers/goose/test-executor-binding.mjs providers/goose/test-catan-task-projection.mjs providers/goose/test-catan-stage-instructions.mjs providers/goose/test-live-admission-runtime.mjs

  orchestrator-smoke:
    name: Orchestrator Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Validate live owner and fail-closed semantics
        run: |
          set -euo pipefail
          node --test providers/goose/test-autonomous-admission-loop.mjs providers/goose/test-live-admission-runtime.mjs

  ci-gate:
    name: DPT CI Gate
    if: always()
    needs: [repository-integrity, canonical-governance, schemas, deterministic-runtime, provider-contracts, orchestrator-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required validation
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "Results: $RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]
          echo "DPT CI Gate PASS"
